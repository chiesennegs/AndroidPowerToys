name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :libadb:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload debug build and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AndroidPowerToys-debug-ci
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            third_party/libadb/build/reports/tests/testDebugUnitTest/
